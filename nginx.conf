events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Timeouts & Buffer Settings for Reverse Proxy & Cloudflare Compatibility
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;
    client_max_body_size  50M;

    # Unified Server Block (Handles both HTTP & HTTPS from Cloudflare)
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name crm.cogculture.agency localhost;

        # Point Nginx to the Let's Encrypt certificates
        ssl_certificate /etc/letsencrypt/live/crm.cogculture.agency/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crm.cogculture.agency/privkey.pem;

        # Route API queries to FastAPI Backend
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route documentation queries to Backend
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route standard queries to Next.js Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pass Cloudflare's original scheme if available, otherwise use Nginx's
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Pass standard headers (Allows Next.js to handle its own caching)
            proxy_http_version 1.1;
            
            # Note: We are NO LONGER aggressively setting Cache-Control to no-cache.
            # This allows Cloudflare and Chrome to cache Next.js static assets,
            # which will stop the server from CPU/Memory crashing.
        }
    }
}
