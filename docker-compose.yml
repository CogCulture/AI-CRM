services:
  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - RUN_BACKGROUND_SCHEDULER=true
      - GOOGLE_REDIRECT_URI=https://crm.cogculture.agency/api/sheets/callback
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        # Route API requests through the Nginx reverse proxy
        - NEXT_PUBLIC_API_URL=
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://backend:8000
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always
